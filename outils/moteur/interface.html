<style>

      --encre-3: #858da0;
      --trait: #2f3442;

  .ferme[hidden] { display: none; }
  .ferme div { max-width: 460px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>
'use strict';
const CONFIG = window.CONFIG ?? { outils: {}, types: {}, zones: {}, depot: '', dossier: '' };
const JETON = new URLSearchParams(location.search).get('jeton') ?? '';
const $ = (selecteur) => document.querySelector(selecteur);

const ICONES = {
  'mettre-a-jour': '<path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7"/><path d="M20 4v4.7h-4.7"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.3"/><path d="M4 20v-4.7h4.7"/>',
  commencer: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  envoyer: '<path d="M7 18.5a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.4-1.2A4.5 4.5 0 0 1 17.5 18.5"/><path d="M12 12.5V20M9 15.5l3-3 3 3"/>',
  proposer: '<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7"/><path d="M18 15.5V9a3 3 0 0 0-3-3h-3.5"/><path d="M13.5 3.5 11 6l2.5 2.5"/>',
  fusionner: '<circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 7.5v9"/><path d="M6 8c0 3.5 3.5 4 9.5 4"/>',

  actualiser: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  dossier: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  github: '<path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  plus: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  ok: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16.5 9.5"/>',
  attention: '<path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.1"/>',
  stop: '<circle cx="12" cy="12" r="9"/><path d="M8.5 12h7"/>',
  erreur: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.1"/>',
  attente: '<path d="M12 3a9 9 0 1 0 9 9"/>',
  poste: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
};

const ETAPES = [
  { action: 'mettre-a-jour', aide: 'Récupérer le dernier travail commun (dev)' },
  { action: 'commencer', aide: 'Une nouvelle tâche, à partir du dernier dev' },
  { action: 'envoyer', aide: 'Enregistrer ton travail et le sauvegarder sur GitHub' },
  { action: 'proposer', aide: 'Demander que ta tâche rejoigne dev' },
  { action: 'fusionner', aide: 'Faire entrer une proposition validée dans dev' },
];

const CI = {
  aucune: ['pas de vérification', ''],
  'en-cours': ['vérifications en cours', 'ambre'],
  verte: ['vérifications vertes', 'vert'],
  rouge: ['vérifications rouges', 'rouge'],
};
const RELECTURE = {
  APPROVED: ['acceptée', 'vert'],
  CHANGES_REQUESTED: ['changements demandés', 'rouge'],
  REVIEW_REQUIRED: ['à relire', 'ambre'],
  '': ['relecture non obligatoire', ''],
};

/** Petit constructeur d'éléments : h('div', { class: 'x', onclick: f }, enfants…). */
function h(balise, proprietes, ...enfants) {
  const el = document.createElement(balise);
  for (const [cle, valeur] of Object.entries(proprietes ?? {})) {
    if (valeur === null || valeur === undefined || valeur === false) continue;
    if (cle === 'class') el.className = valeur;
    else if (cle.startsWith('on')) el.addEventListener(cle.slice(2), valeur);
    else el.setAttribute(cle, valeur === true ? '' : valeur);
  }
  for (const enfant of enfants.flat(Infinity)) {
    if (enfant === null || enfant === undefined || enfant === false) continue;
    el.append(enfant instanceof Node ? enfant : document.createTextNode(String(enfant)));
  }
  return el;
}

function icone(nom, classe = '') {
  const span = h('span', { class: `icone ${classe}`, 'aria-hidden': 'true' });
  span.innerHTML = `<svg viewBox="0 0 24 24">${ICONES[nom] ?? ''}</svg>`;
  return span;
}

const puce = ([texte, couleur]) => h('span', { class: `puce ${couleur}` }, texte);
const nomBouton = (action) => CONFIG.outils[action] ?? action;
const majuscule = (texte) => (texte ? texte[0].toUpperCase() + texte.slice(1) : texte);

/** Texte avec les adresses web rendues cliquables. */
function texteAvecLiens(texte) {
  return String(texte)
    .split(/(https?:\/\/[^\s)]+)/)
    .map((morceau, i) =>
      i % 2 ? h('a', { href: morceau, target: '_blank', rel: 'noreferrer noopener' }, morceau) : morceau,
    );
}

/** Les « Nom d'un bouton » cités dans un message, dans l'ordre. */
function actionsCitees(texte) {
  const trouvees = [];
  for (const [action, nom] of Object.entries(CONFIG.outils)) {
    const position = texte.indexOf(`« ${nom} »`);
    if (position >= 0) trouvees.push([position, action]);
  }
  return trouvees.sort((a, b) => a[0] - b[0]).map(([, action]) => action);
}

async function api(chemin, corps) {
  const options = { headers: { 'x-jeton': JETON } };
  if (corps !== undefined) {
    options.method = 'POST';
    options.headers['content-type'] = 'application/json';
    options.body = JSON.stringify(corps);
  }
  const r = await fetch(chemin, options);
  const donnees = await r.json().catch(() => ({}));
  return { statut: r.status, ...donnees };
}

// ---------------------------------------------------------------------------
// « Où j'en suis »
// ---------------------------------------------------------------------------

let etat = null;
let erreurEtat = '';
let lecture = null;
let derniereLecture = 0;

async function actualiser() {
  if (lecture) return lecture;
  if (actionEnCours()) return;
  lecture = (async () => {
    dessinerBoutonActualiser(true);
    try {
      const r = await api('/api/etat');
      if (r.statut === 409) {
        setTimeout(actualiser, 3000);
        return;
      }
      if (r.etat) {
        etat = r.etat;
        erreurEtat = '';
      } else {
        erreurEtat = r.erreur ?? 'Je n’arrive pas à lire où tu en es.';
      }
      derniereLecture = Date.now();
    } catch {
      // le serveur ne répond plus : le battement de cœur s'en occupe
    } finally {
      dessinerBoutonActualiser(false);
      dessiner();
      lecture = null;
    }
  })();
  return lecture;
}

function dessinerBoutonActualiser(occupe) {
  $('#actualiser').replaceChildren(icone(occupe ? 'attente' : 'actualiser', occupe ? 'tourne' : ''), 'Actualiser');
  $('#actualiser').disabled = occupe;
}

function lireBranche(nom) {
  const m = /^(feat|fix)\/([a-z]+)-(.+)$/.exec(nom);
  if (!m) return null;
  return {
    type: m[1] === 'fix' ? 'Correction' : 'Fonctionnalité',
    zone: m[2],
    sujet: m[3].replaceAll('-', ' '),
  };
}

function dessiner() {
  dessinerPosition();
  dessinerConseil();
  dessinerEtapes();
  dessinerPropositions();
  dessinerTaches();
  dessinerCI();
  dessinerMenu();
}

function dessinerPosition() {
  const boite = $('#position');
  if (erreurEtat && !etat) {
    boite.replaceChildren(h('div', { class: 'bandeau rouge' }, icone('erreur'), h('p', null, erreurEtat)));
    return;
  }
  if (!etat) return;
  const e = etat;
  const contenu = [];
  if (!e.branche) {
    contenu.push(h('p', { class: 'position-ligne' }, 'Tu n’es sur aucune branche.'));
    contenu.push(h('p', { class: 'position-detail' }, 'Demande à Claude de te remettre sur dev.'));
  } else if (e.surTache) {
    const infos = lireBranche(e.branche);
    contenu.push(h('p', { class: 'position-ligne' }, 'Tu travailles sur la tâche ', h('span', { class: 'code' }, e.branche)));
    if (infos) contenu.push(h('p', { class: 'position-detail' }, `${infos.type} · ${infos.zone} · ${infos.sujet}`));
  } else {
    const role = e.branche === 'dev' ? 'la version de travail commune' : 'la version stable';
    contenu.push(h('p', { class: 'position-ligne' }, 'Tu es sur ', h('span', { class: 'code' }, e.branche), `, ${role}.`));
    contenu.push(h('p', { class: 'position-detail' }, 'On n’y travaille jamais directement : commence une tâche.'));
  }

  const puces = [];
  const mods = e.modifications ?? [];
  let liste = null;
  if (mods.length) {
    liste = h(
      'ul',
      { class: 'fichiers', hidden: mods.length > 4 },
      mods.slice(0, 30).map((f) => h('li', null, h('span', null, f.etat), h('code', null, f.chemin))),
      mods.length > 30 ? h('li', null, `… et ${mods.length - 30} autres`) : null,
    );
    puces.push(
      h(
        'button',
        { class: 'puce ambre', type: 'button', title: 'Voir les fichiers', onclick: () => { liste.hidden = !liste.hidden; } },
        `${mods.length} fichier${mods.length > 1 ? 's' : ''} modifié${mods.length > 1 ? 's' : ''}, pas encore enregistré${mods.length > 1 ? 's' : ''}`,
      ),
    );
  } else {
    puces.push(puce(['aucune modification en attente', 'vert']));
  }
  if (e.nonEnvoyes) puces.push(puce([`${e.nonEnvoyes} enregistrement${e.nonEnvoyes > 1 ? 's' : ''} pas encore envoyé${e.nonEnvoyes > 1 ? 's' : ''}`, 'ambre']));
  if (e.retard) {
    const texte = e.surTache ? `dev a ${e.retard} nouveauté${e.retard > 1 ? 's' : ''} que ta tâche n’a pas` : `${e.retard} nouveauté${e.retard > 1 ? 's' : ''} à récupérer`;
    puces.push(puce([texte, 'bleu']));
  }
  contenu.push(h('div', { class: 'puces' }, puces), liste);

  if (e.surTache && e.avecGitHub) {
    const p = e.maProposition;
    let bloc;
    if (p) {
      bloc = [
        h('div', null, 'Ta proposition : ', h('a', { href: p.url, target: '_blank', rel: 'noreferrer noopener' }, `n°${p.numero} ${p.titre}`)),
        h('div', { class: 'puces' }, [
          p.brouillon ? puce(['brouillon', '']) : null,
          puce(CI[p.ci] ?? CI.aucune),
          puce(RELECTURE[p.relecture] ?? RELECTURE['']),
          p.conflit ? puce(['en conflit avec dev', 'rouge']) : null,
        ]),
      ];
    } else if (e.fusionnee) {
      bloc = [h('div', null, `Ta tâche est déjà fusionnée (n°${e.fusionnee.numero}).`)];
    } else {
      bloc = [h('div', { class: 'position-detail' }, 'Pas encore de proposition pour cette tâche.')];
    }
    contenu.push(h('div', { class: 'ma-pr' }, bloc));
  }
  if (!e.avecGitHub) {
    contenu.push(
      h('div', { class: 'bandeau ambre', style: 'margin-top:14px' }, icone('attention'),
        h('p', null, e.enLigne
          ? 'GitHub n’est pas prêt sur ce PC : les propositions ne s’affichent pas. Utilise « Vérifier mon poste » (menu …).'
          : 'GitHub ne répond pas (connexion internet ?). Tu peux continuer à travailler.')),
    );
  }
  if (erreurEtat) contenu.push(h('div', { class: 'bandeau rouge', style: 'margin-top:14px' }, icone('erreur'), h('p', null, erreurEtat)));
  boite.replaceChildren(...contenu.filter(Boolean));
}

function dessinerConseil() {
  const boite = $('#conseil');
  if (!etat?.conseil) {
    boite.replaceChildren();
    return;
  }
  const { action, texte } = etat.conseil;
  boite.replaceChildren(
    h('div', { class: 'conseil' },
      h('p', null, h('strong', null, 'Et maintenant ? '), majuscule(texte)),
      action
        ? h('button', {
            class: 'bouton principal',
            type: 'button',
            onclick: () => (action === 'installer' ? ouvrir('installer') : lancer(action)),
          }, icone(ICONES[action] ? action : 'poste'), nomBouton(action))
        : null,
    ),
  );
}

function dessinerEtapes() {
  const conseillee = etat?.conseil?.action;
  $('#etapes').replaceChildren(
    ...ETAPES.map((etape, i) =>
      h('button', {
        class: `etape${etape.action === conseillee ? ' conseillee' : ''}`,
        type: 'button',
        disabled: actionEnCours(),
        onclick: () => lancer(etape.action),
      },
      h('span', { class: 'num' }, etape.action === conseillee ? 'conseillé' : String(i + 1)),
      icone(etape.action),
      h('strong', null, nomBouton(etape.action)),
      h('small', null, etape.aide)),
    ),
  );
}

function peutFusionner(p) {
  if (p.brouillon || p.conflit || p.ci !== 'verte') return false;
  if (p.relecture === 'CHANGES_REQUESTED') return false;
  return p.relecture !== 'REVIEW_REQUIRED' || etat?.admin;
}

function dessinerPropositions() {
  const boite = $('#propositions');
  if (!etat) return;
  if (!etat.avecGitHub) {
    boite.replaceChildren(h('p', { class: 'vide' }, 'GitHub n’est pas joignable pour le moment.'));
    return;
  }
  if (!etat.ouvertes.length) {
    boite.replaceChildren(h('p', { class: 'vide' }, 'Aucune proposition ouverte.'));
    return;
  }
  boite.replaceChildren(
    ...etat.ouvertes.map((p) =>
      h('div', { class: 'ligne-pr' },
        h('div', { class: 'haut' },
          h('span', { class: 'num' }, `n°${p.numero}`),
          h('a', { href: p.url, target: '_blank', rel: 'noreferrer noopener', title: 'Ouvrir sur GitHub' }, p.titre)),
        h('div', { class: 'bas' },
          h('span', { class: 'puce' }, p.auteur || '?'),
          p.base !== 'dev' ? h('span', { class: 'puce bleu' }, `vers ${p.base}`) : null,
          p.brouillon ? puce(['brouillon', '']) : null,
          puce(CI[p.ci] ?? CI.aucune),
          puce(RELECTURE[p.relecture] ?? RELECTURE['']),
          p.conflit ? puce(['en conflit', 'rouge']) : null,
          peutFusionner(p)
            ? h('button', { class: 'bouton petit', type: 'button', disabled: actionEnCours(), onclick: () => lancer('fusionner', { pr: String(p.numero) }) }, icone('fusionner'), 'Fusionner')
            : null),
      ),
    ),
  );
}

function dessinerTaches() {
  const autres = etat?.autres ?? [];
  $('#bloc-taches').hidden = !autres.length;
  $('#taches').replaceChildren(
    ...autres.map((t) =>
      h('div', { class: 'ligne-tache' },
        h('span', { class: 'code' }, t.nom),
        t.disparue
          ? h('span', { class: 'puce vert', title: '« Mettre à jour » la rangera' }, 'fusionnée')
          : h('button', { class: 'bouton petit', type: 'button', disabled: actionEnCours(), onclick: () => lancer('commencer', { reprendre: t.nom }) }, 'Reprendre')),
    ),
  );
}

function dessinerCI() {
  const c = etat?.derniereCI;
  $('#bloc-ci').hidden = !c;
  if (!c) return;
  const couleur = { verte: 'vert', rouge: 'rouge', 'en-cours': 'ambre' }[c.resultat];
  const texte = { verte: 'verte', rouge: 'rouge', 'en-cours': 'en cours' }[c.resultat];
  $('#ci-dev').replaceChildren(
    h('div', { class: 'puces', style: 'margin:0' }, puce([texte, couleur]), h('span', { class: 'position-detail', style: 'margin:0' }, c.quand)),
  );
}

function dessinerMenu() {
  const elements = [
    h('button', { type: 'button', onclick: () => ouvrir('installer') },
      h('span', null, nomBouton('installer')), h('small', null, 'Revérifie Git, Node.js, GitHub (fenêtre à part)')),
  ];
  if (etat?.admin) {
    elements.push(
      h('button', { type: 'button', onclick: () => lancer('fin-de-sprint', { essai: true }) },
        h('span', null, 'Fin de sprint — essai'), h('small', null, 'Montre ce qui serait fait, sans rien changer')),
      h('button', { type: 'button', onclick: () => lancer('fin-de-sprint') },
        h('span', null, 'Fin de sprint'), h('small', null, 'dev vers main, puis version v0.<sprint>.0')),
    );
  }
  $('#menu-liste').replaceChildren(...elements);
}

async function ouvrir(quoi) {
  $('#menu').open = false;
  await api('/api/ouvrir', { quoi }).catch(() => {});
}

// ---------------------------------------------------------------------------
// Actions : panneau, messages, questions
// ---------------------------------------------------------------------------

let action = null; // { id, nom, source, fini }

const actionEnCours = () => Boolean(action && !action.fini);

async function lancer(nom, options = {}) {
  if (actionEnCours()) return;
  $('#menu').open = false;
  if (lecture) await lecture;
  action = { id: null, nom, source: null, fini: false };
  ouvrirPanneau(nom);
  dessinerEtapes();
  let r;
  try {
    r = await api('/api/action', { action: nom, options });
  } catch {
    r = { statut: 0, erreur: 'Les outils ne répondent plus.' };
  }
  if (r.statut !== 200 || !r.id) {
    recevoir({ genre: 'erreur', texte: r.erreur ?? 'Impossible de lancer cette action.' });
    recevoir({ genre: 'fin', code: 3 });
    return;
  }
  action.id = r.id;
  const source = new EventSource(`/api/flux?id=${encodeURIComponent(r.id)}&jeton=${encodeURIComponent(JETON)}`);
  action.source = source;
  source.onmessage = (evenement) => recevoir(JSON.parse(evenement.data));
}

function ouvrirPanneau(nom) {
  $('#panneau-titre').textContent = nomBouton(nom);
  $('#panneau-icone').replaceChildren(icone(ICONES[nom] ? nom : 'attente'));
  $('#journal').replaceChildren(h('div', { class: 'chargement', id: 'en-cours' }, icone('attente', 'tourne'), 'C’est parti…'));
  $('#question').hidden = true;
  $('#pied').hidden = true;
  $('#voile').hidden = false;
}

function ajouter(element) {
  const journal = $('#journal');
  const indicateur = $('#en-cours');
  journal.insertBefore(element, indicateur);
  journal.scrollTop = journal.scrollHeight;
}

function recevoir(m) {
  switch (m.genre) {
    case 'titre':
      return;
    case 'section':
      return ajouter(h('div', { class: 'j-section' }, m.texte));
    case 'etape':
      return ajouter(h('div', { class: 'j-etape' }, m.texte));
    case 'info':
      return ajouter(h('div', { class: 'j-info' }, texteAvecLiens(m.texte.trim())));
    case 'ok':
      return ajouter(h('div', { class: 'j-ok' }, icone('ok'), h('span', null, texteAvecLiens(m.texte))));
    case 'attention':
      return ajouter(h('div', { class: 'bandeau ambre' }, icone('attention'), h('p', null, texteAvecLiens(m.texte))));
    case 'suite':
      return ajouter(blocSuite(m.texte));
    case 'stop':
      return ajouter(h('div', { class: 'bandeau ambre' }, icone('stop'),
        h('div', { class: 'pile' },
          h('p', null, h('strong', null, 'Stop. '), texteAvecLiens(m.texte), m.texte.startsWith('Annulé') ? '' : ' Rien n’a été cassé.'),
          boutonsCites(m.texte))));
    case 'erreur':
      return ajouter(h('div', { class: 'bandeau rouge' }, icone('erreur'),
        h('div', null, h('p', null, h('strong', null, 'Erreur inattendue : '), m.texte), h('p', null, 'Copie ce message et demande à Claude de regarder.'),
          m.pile ? h('div', { class: 'j-pile' }, m.pile) : null)));
    case 'question':
      return montrerQuestion(m);
    case 'reponse':
      return ajouter(h('div', { class: 'j-reponse' }, `→ ${m.texte}`));
    case 'fin':
      return terminer(m.code);
    default:
      if (m.texte?.trim()) ajouter(h('div', { class: 'j-brut' }, m.texte));
  }
}

function blocSuite(texte) {
  return h('div', { class: 'j-suite' }, h('p', null, h('strong', null, 'Et maintenant ? '), majuscule(texte)), boutonsCites(texte));
}

/** Un bouton pour chaque outil cité dans le texte (« Envoyer mon travail »…), le premier mis en avant. */
function boutonsCites(texte) {
  const actions = actionsCitees(texte).filter((a) => a !== 'etat');
  if (!actions.length) return null;
  return h('div', { class: 'actions' }, actions.map((a, i) =>
    h('button', {
      class: `bouton${i === 0 ? ' principal' : ''}`,
      type: 'button',
      onclick: () => (a === 'installer' ? ouvrir('installer') : enchainer(a)),
    }, icone(ICONES[a] ? a : 'poste'), nomBouton(a))));
}

/** Un nom technique (zone, nom de tâche) s'écrit tel quel, en police de code ; une phrase prend sa majuscule. */
function nomDuChoix(c) {
  return String(c.valeur) === c.libelle ? h('strong', null, h('code', null, c.libelle)) : h('strong', null, majuscule(c.libelle));
}

function montrerQuestion(q) {
  $('#en-cours')?.remove();
  const form = $('#question');
  form.className = `question${q.danger ? ' danger' : ''}`;
  form.onsubmit = (evenement) => evenement.preventDefault();
  const annuler = h('button', { class: 'bouton discret', type: 'button', onclick: annulerAction }, 'Annuler');
  let contenu;

  if (q.forme === 'oui-non') {
    contenu = [
      h('div', { class: 'intitule' }, q.question),
      q.danger ? h('p', { class: 'aide' }, 'Réfléchis bien : cette réponse passe outre une règle du projet.') : null,
      h('div', { class: 'boutons' },
        annuler,
        h('button', { class: 'bouton', type: 'button', onclick: () => repondre('non', 'Non') }, 'Non'),
        h('button', { class: `bouton ${q.danger ? 'danger' : 'principal'}`, type: 'button', onclick: () => repondre('oui', 'Oui') }, 'Oui')),
    ];
  } else if (q.forme === 'choix') {
    contenu = [
      h('div', { class: 'intitule' }, q.question),
      h('div', { class: 'choix' }, q.choix.map((c, i) =>
        h('button', {
          type: 'button',
          class: String(i + 1) === q.defaut ? 'defaut' : '',
          onclick: () => repondre(String(c.valeur), c.detail ? `${c.libelle} — ${c.detail}` : majuscule(c.libelle)),
        }, nomDuChoix(c), c.detail ? h('small', null, c.detail) : null))),
      h('div', { class: 'boutons' }, annuler),
    ];
  } else {
    const champ = h('input', { type: 'text', id: 'reponse', value: q.defaut ?? '', autocomplete: 'off', spellcheck: 'true' });
    const valider = () => {
      const valeur = champ.value.trim();
      if (!valeur && !q.facultatif && !q.defaut) {
        champ.focus();
        return;
      }
      repondre(valeur, valeur || q.defaut || '(vide)');
    };
    form.onsubmit = (evenement) => {
      evenement.preventDefault();
      valider();
    };
    contenu = [
      h('label', { for: 'reponse' }, q.question.replace(/…?\s*Entrée pour passer/, '')),
      champ,
      q.facultatif ? h('p', { class: 'aide' }, 'Tu peux laisser vide.') : null,
      h('div', { class: 'boutons' }, annuler, h('button', { class: 'bouton principal', type: 'submit' }, 'Valider')),
    ];
  }
  form.replaceChildren(...contenu.filter(Boolean));
  form.hidden = false;
  requestAnimationFrame(() => (form.querySelector('input') ?? form.querySelector('.choix button, .boutons .principal, .boutons .danger'))?.focus());
}

async function repondre(valeur, affichage) {
  $('#question').hidden = true;
  recevoir({ genre: 'reponse', texte: affichage });
  $('#journal').append(h('div', { class: 'chargement', id: 'en-cours' }, icone('attente', 'tourne'), 'Je continue…'));
  await api('/api/repondre', { id: action.id, reponse: valeur }).catch(() => {});
}

async function annulerAction() {
  $('#question').hidden = true;
  await api('/api/annuler', { id: action.id }).catch(() => {});
}

function terminer(code) {
  if (action) {
    action.fini = true;
    action.source?.close();
  }
  $('#en-cours')?.remove();
  $('#question').hidden = true;
  if (code === 0 && !$('#journal .j-suite')) ajouter(h('div', { class: 'j-ok' }, icone('ok'), h('span', null, 'Terminé.')));
  $('#pied').hidden = false;
  $('#fermer').focus();
  actualiser();
}

function fermerPanneau() {
  if (actionEnCours()) return;
  $('#voile').hidden = true;
  dessiner();
}

function enchainer(nom) {
  fermerPanneau();
  if (nom === 'etat') actualiser();
  else lancer(nom);
}

// ---------------------------------------------------------------------------
// Démarrage
// ---------------------------------------------------------------------------

$('#actualiser').addEventListener('click', actualiser);
$('#dossier').replaceChildren(icone('dossier'), 'Dossier du projet');
$('#dossier').addEventListener('click', () => ouvrir('dossier'));
if (CONFIG.depot) {
  $('#github').href = CONFIG.depot;
  $('#github').hidden = false;
  $('#github').replaceChildren(icone('github'), 'GitHub');
}
$('#menu > summary').replaceChildren(icone('plus'), h('span', { class: 'visuellement-cache' }, 'Plus'));
$('#fermer').addEventListener('click', fermerPanneau);
$('#attente').replaceChildren(icone('attente', 'tourne'), 'Je regarde où tu en es…');
document.addEventListener('keydown', (evenement) => {
  if (evenement.key === 'Escape') {
    if (!$('#voile').hidden) fermerPanneau();
    else $('#menu').open = false;
  }
  if (evenement.key === 'F5') {
    evenement.preventDefault();
    if (!actionEnCours()) actualiser();
  }
});
document.addEventListener('click', (evenement) => {
  if (!$('#menu').contains(evenement.target)) $('#menu').open = false;
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  signeDeVie();
  if (Date.now() - derniereLecture > 20000) actualiser();
});
// Fenêtre fermée : on prévient le serveur, qui s'arrête au bout de quelques secondes (sauf si la page revient).
window.addEventListener('pagehide', () => navigator.sendBeacon(`/api/au-revoir?jeton=${encodeURIComponent(JETON)}`));

// Une vérification (CI) tourne : on relit toutes les 45 s pour voir le résultat arriver.
setInterval(() => {
  const attend = etat && [etat.maProposition, ...(etat.ouvertes ?? [])].some((p) => p?.ci === 'en-cours');
  if (attend && document.visibilityState === 'visible' && !actionEnCours()) actualiser();
}, 45000);

// Battement de cœur : sans page, le serveur s'arrête ; sans serveur, la page le dit.
// (Fenêtre réduite : le navigateur ralentit ce minuteur jusqu'à une fois par minute, le serveur le sait.)
let echecs = 0;
async function signeDeVie() {
  try {
    const r = await fetch('/api/vivant', { method: 'POST', headers: { 'x-jeton': JETON } });
    echecs = r.ok ? 0 : echecs + 1;
  } catch {
    echecs += 1;
  }
  if (echecs >= 2) $('#ferme').hidden = false;
}
