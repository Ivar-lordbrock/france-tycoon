name: Outils du duo

# Vérifie les outils du duo (outils/) sur Windows, le système des deux développeurs.
# Ne tourne que si outils/ ou ce fichier changent.

on:
  push:
    branches: [main, dev]
    paths: ['outils/**', '.github/workflows/outils.yml']
  pull_request:
    branches: [main, dev]
    paths: ['outils/**', '.github/workflows/outils.yml']

permissions:
  contents: read

jobs:
  outils:
    name: Outils (Windows)
    runs-on: windows-latest
    env:
      DUO_SANS_PAUSE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Tests du moteur (faux dépôts locaux)
        run: node --test outils/
      - name: Installateur en mode essai, lancé comme un double-clic
        shell: cmd
        run: |
          call outils\1-installer-mon-poste.bat -Essai > sortie.txt 2>&1
          type sortie.txt
          findstr /c:"Tout est pr" sortie.txt
      - name: Lanceur avec un PATH presque vide (Node et Git hors du PATH)
        shell: cmd
        run: |
          set "PATH=%SystemRoot%\system32;%SystemRoot%;%SystemRoot%\System32\WindowsPowerShell\v1.0"
          call outils\6-ou-j-en-suis.bat > sortie.txt 2>&1
          type sortie.txt
          findstr /c:"Ta position" /c:"Node.js est introuvable" sortie.txt
